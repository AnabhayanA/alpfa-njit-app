name: ALPFANJIT
options:
  bundleIdPrefix: org.alpfanjit
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.10
    DEVELOPMENT_TEAM: ""
targets:
  ALPFANJIT:
    type: application
    platform: iOS
    sources:
      - path: ALPFANJIT
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.alpfanjit.app
        INFOPLIST_FILE: ALPFANJIT/Supporting/Info.plist
    entitlements:
      path: ALPFANJIT/Supporting/ALPFANJIT.entitlements
      properties:
        aps-environment: development
    scheme:
      testTargets: []
